[package]
name = "micaspeak"
version = "1.0.0"
description = "MicaSpeak TS3 client"
authors = ["MicaSpeak"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
futures = "0.3"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", features = ["audio", "default-tls", "unstable"], default-features = false }
# 音频发送需要直接构造 OutAudio 包；tsproto-packets 是 tsclientlib 仓库的子目录，
# cargo 无法对 git 仓库子目录建依赖，故 vendor 同 rev 源码（见 vendor/tsproto-packets），
# 并在 workspace 根 Cargo.toml 用 [patch] 统一为同一份，避免类型不一致。
tsproto-packets = { path = "vendor/tsproto-packets" }
# 采集编码用；与 tsclientlib audio feature 锁定同一版本
audiopus = "0.3.0-rc.0"
cpal = "0.18"
# M3 B：降噪与 VAD（任务卡白名单依赖，锁小版本）。
nnnoiseless = "0.5.2"
# 窗口材质：ui-revamp 由 Mica 换系统 Acrylic（Mica 显色太淡）。apply_acrylic
# 在 Win11 22H2+ 走 DWM 系统背衬（拖动流畅）；失败/22H2 以下/--force-fallback
# 回退实体背景。
window-vibrancy = "0.8"

# M3：WH_KEYBOARD_LL 低级键盘钩子。复用 Cargo.lock 已有的 0.61.3，
# feature 按任务卡白名单；ui-revamp 增开 Win32_Graphics_Dwm（材质深浅属性）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
