[package]
name = "micaspeak"
version = "0.1.0"
description = "MicaSpeak TS3 client"
authors = ["MicaSpeak"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.8.0", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
futures = "0.3"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", features = ["default-tls", "unstable"], default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
